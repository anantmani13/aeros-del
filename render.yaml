# Render Blueprint — one-click deploy of AEROS · DEL
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aeros-del
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # NOTE: Do NOT set PORT here — Render injects $PORT (default 10000)
    # run.py already reads env PORT, so it binds correctly.
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: DATA_REFRESH_INTERVAL
        value: "300"
      - key: LLM_ENHANCED
        value: "true"
      - key: OPENAQ_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPTILER_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
